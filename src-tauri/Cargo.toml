[package]
name = "deeptutor-desktop"
version = "0.1.0"
description = "Tauri desktop shell for DeepTutor"
authors = [ "DeepTutor Desktop contributors" ]
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"

[lib]
name = "deeptutor_desktop_lib"
crate-type = [
  "staticlib",
  "cdylib",
  "rlib"
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = [
  "process",
  "io-util",
  "sync",
  "time",
  "macros",
  "rt",
  "signal"
] }
