name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon and Intel macOS build on matching runners so the
          # embedded Python runtime matches the host architecture.
          # Apple Silicon 与 Intel macOS 在对应架构的 runner 上构建,
          # 保证内嵌 Python runtime 与宿主架构一致。
          - {os: macos-14, target: darwin-arm64, platform: macos-apple-silicon}
          - {os: macos-13, target: darwin-x64, platform: macos-intel}
          - {os: ubuntu-22.04, target: linux-x64, platform: linux-x64}
          - {os: windows-latest, target: win32-x64, platform: windows-x64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v5

      - uses: dtolnay/rust-toolchain@stable

      # libfuse2 is required to execute the linuxdeploy AppImage tool during
      # Tauri's AppImage bundling step. Keep shell comments outside the
      # folded run block: YAML folding joins lines and would swallow args.
      # linuxdeploy 以 AppImage 形式运行, 打包 AppImage 时需要 libfuse2。
      # 注释必须放在折叠块外: YAML 折叠会拼接各行, 行内注释会吞掉参数。
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev build-essential curl wget file
          libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          libfuse2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build embedded runtime (${{ matrix.target }})
        shell: bash
        run: bash scripts/build-runtime.sh ${{ matrix.target }}

      - name: Build desktop bundle
        run: pnpm build

      # Stage installers under explicit platform/arch names — Intel and
      # Apple Silicon macOS packages must never share a filename.
      # 以明确的平台/架构命名归档安装包 —— Intel 与 Apple Silicon 的
      # macOS 包绝不共用文件名。
      - name: Stage packages
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p packages
          shopt -s nullglob
          for f in src-tauri/target/release/bundle/dmg/*.dmg; do
            cp "$f" "packages/DeepTutor-Desktop_${VERSION}_${{ matrix.platform }}.dmg"
          done
          for f in src-tauri/target/release/bundle/deb/*.deb; do
            cp "$f" "packages/DeepTutor-Desktop_${VERSION}_${{ matrix.platform }}.deb"
          done
          for f in src-tauri/target/release/bundle/appimage/*.AppImage; do
            cp "$f" "packages/DeepTutor-Desktop_${VERSION}_${{ matrix.platform }}.AppImage"
          done
          ls -lh packages/

      - name: Stage packages (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p packages
          shopt -s nullglob
          for f in src-tauri/target/release/bundle/nsis/*.exe; do
            cp "$f" "packages/DeepTutor-Desktop_${VERSION}_${{ matrix.platform }}_setup.exe"
          done
          ls -lh packages/

      - uses: actions/upload-artifact@v4
        with:
          name: DeepTutor-Desktop-${{ matrix.platform }}
          path: packages/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history and tags feed the changelog generator.
      # 双语更新日志生成需要完整历史与 tag。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Cut the version section in both changelog files and capture the
      # bilingual release notes for the GitHub Release body.
      # 在两份 changelog 中落版本小节, 并捕获双语 release notes
      # 供发布页正文使用。
      - name: Update changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/update-changelog.ts --release "$VERSION" > release-notes.md

      # Push the published changelog back to main so the repo copy stays
      # authoritative; skipped when the tag is re-run with nothing to change.
      # The checkout is a detached HEAD at the tag, so push to main explicitly.
      # 将落版后的 changelog 推回 main, 保持仓库内副本为权威版本;
      # 重跑 tag 且无变化时自动跳过。tag 检出为分离 HEAD, 显式推送到 main。
      - name: Commit changelog update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md CHANGELOG.zh-CN.md
          if git diff --cached --quiet; then
            echo "changelog already up to date"
          else
            git commit -m "chore(release): publish changelog for ${GITHUB_REF_NAME}" \
              -m "zh-CN: 发布 ${GITHUB_REF_NAME} 双语更新日志"
            git push origin HEAD:main
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
