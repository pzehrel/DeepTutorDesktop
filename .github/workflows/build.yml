name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Pushing a `v<version>` tag is the release action: this job writes the tag's
  # version into every manifest, commits it to main, and the build jobs then
  # build that commit — so nobody edits version numbers by hand.
  # 推送 `v<version>` tag 即为发布动作: 本 job 把 tag 的版本写入所有清单
  # 文件并提交到 main, 构建 job 随后构建该提交 —— 版本号无需手工修改。
  version:
    name: version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write the tag version into every manifest
        id: bump
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/set-version.ts "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # `[skip ci]` keeps this bookkeeping commit from starting a second build.
      # `[skip ci]` 阻止这次记账提交触发第二轮构建。
      - name: Commit the version bump to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json frontend/package.json src-tauri/tauri.conf.json \
            src-tauri/Cargo.toml src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "version already ${{ steps.bump.outputs.version }}"
          else
            git commit -m "chore(release): set version to ${{ steps.bump.outputs.version }} [skip ci]" \
              -m "zh-CN: 发布前将版本号置为 ${{ steps.bump.outputs.version }}"
            git push origin HEAD:main
          fi

  build:
    name: ${{ matrix.platform }}
    needs: version
    # Run for every non-tag event too, where the `version` job is skipped.
    # 非 tag 事件下 `version` job 会被跳过, 此时仍需构建。
    if: always() && !cancelled()
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon and Intel macOS build on matching runners so the
          # embedded Python runtime matches the host architecture. macos-13
          # was retired on 2025-12-04; macos-15-intel is its replacement
          # label for standard x86_64 runners.
          # Apple Silicon 与 Intel macOS 在对应架构的 runner 上构建,
          # 保证内嵌 Python runtime 与宿主架构一致。macos-13 已于
          # 2025-12-04 退役, macos-15-intel 是标准 x86_64 runner 的
          # 替代标签。
          # `bundles` holds the per-platform bundle targets passed to the CLI.
          # Windows ships the NSIS setup.exe only: the MSI is redundant and
          # spent ~8 minutes per run compressing the ~1GB embedded runtime.
          # macOS keeps both the .app and the .dmg.
          # `bundles` 为传给 CLI 的各平台打包目标。Windows 只发 NSIS 的
          # setup.exe: MSI 与之重复, 且每次为压缩约 1GB 的内嵌 runtime
          # 多花约 8 分钟。macOS 保留 .app 与 .dmg 两者。
          - {os: macos-14, target: darwin-arm64, platform: macos-apple-silicon, bundles: 'app,dmg'}
          - {os: macos-15-intel, target: darwin-x64, platform: macos-intel, bundles: 'app,dmg'}
          # Linux builds are paused for now per product decision; re-add
          # `- {os: ubuntu-22.04, target: linux-x64, platform: linux-x64, bundles: 'deb,rpm'}`
          # to resume (deb/rpm bundling worked; only AppImage was blocked,
          # see the note near the build step).
          # Linux 构建暂缓 (产品决定); 恢复时重新添加
          # `- {os: ubuntu-22.04, target: linux-x64, platform: linux-x64, bundles: 'deb,rpm'}`
          # 即可 (deb/rpm 打包此前正常, 仅 AppImage 受阻, 见构建步骤注释)。
          - {os: windows-latest, target: win32-x64, platform: windows-x64, bundles: 'nsis'}
    runs-on: ${{ matrix.os }}
    steps:
      # On a tag the version commit lives on main, so build main rather than
      # the tagged commit; ordinary pushes and PRs build their own ref.
      # tag 推送时版本提交位于 main, 因此构建 main 而非 tag 提交;
      # 普通 push 与 PR 仍构建各自 ref。
      - uses: actions/checkout@v4
        with:
          ref: ${{ startsWith(github.ref, 'refs/tags/v') && 'main' || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Cache uv's downloads so runtime builds reuse the CPython archive and
      # the 161-wheel deeptutor dependency tree instead of refetching them.
      # 缓存 uv 下载内容, 让 runtime 构建复用 CPython 压缩包与 161 个
      # wheel 的 deeptutor 依赖树, 无需每次重新下载。
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: dtolnay/rust-toolchain@stable

      # Cache cargo build artifacts to avoid recompiling ~600 crates per run.
      # PRs only restore (save-pr: false) to respect the 10GB repo cache
      # quota; branches still inherit caches saved from main.
      # 缓存 cargo 构建产物, 避免每次重编约 600 个 crate。PR 只恢复
      # 不保存 (save-pr: false), 以控制仓库 10GB 缓存配额; 分支仍可
      # 继承 main 上保存的缓存。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

      # libfuse2 is required to execute the linuxdeploy AppImage tool during
      # Tauri's AppImage bundling step. Keep shell comments outside the
      # folded run block: YAML folding joins lines and would swallow args.
      # linuxdeploy 以 AppImage 形式运行, 打包 AppImage 时需要 libfuse2。
      # 注释必须放在折叠块外: YAML 折叠会拼接各行, 行内注释会吞掉参数。
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev build-essential curl wget file
          libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          libfuse2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build embedded runtime (${{ matrix.target }})
        shell: bash
        run: bash scripts/build-runtime.sh ${{ matrix.target }}

      - name: Build desktop bundle
        # macOS dmg creation misbehaves on GitHub runners: on Apple Silicon it
        # usually succeeds in ~3 minutes, while the Intel runner either fails
        # with "failed to run bundle_dmg.sh" or hangs inside bundle_dmg.sh
        # (hdiutil attach/AppleScript) for the better part of an hour. The same
        # commit bundles fine locally, so each attempt gets a hard timeout,
        # stray hdiutil mounts and half-written images are cleaned up, and the
        # step retries. Cargo and uv caches keep a retry cheap.
        # macOS 的 dmg 在 GitHub runner 上表现异常: Apple Silicon 通常约 3
        # 分钟成功, 而 Intel runner 要么报 "failed to run bundle_dmg.sh",
        # 要么卡在 bundle_dmg.sh 内部 (hdiutil attach/AppleScript) 近一小时。
        # 同一提交在本地可正常打包, 因此为每次尝试设硬超时, 清理残留的
        # hdiutil 挂载与半成品镜像后重试。cargo 与 uv 缓存使重试成本很低。
        #
        # pnpm's script forwarding passes the -- separator through to the
        # tauri CLI, which then hands the flags to cargo; invoke tauri
        # directly via pnpm exec instead of the "build" script. --bundles
        # only accepts per-platform values, hence the matrix field.
        # pnpm 的脚本转发会把 -- 分隔符一并传给 tauri CLI, 导致标志被
        # 转交 cargo; 改用 pnpm exec 直接调用 tauri 而不走 build 脚本。
        # --bundles 只接受各平台自身的目标值, 因此由 matrix 字段提供。
        shell: bash
        run: |
          # 15 minutes per attempt: Apple Silicon needs ~3, Intel ~8 on a good run.
          # 每次尝试 15 分钟: Apple Silicon 约 3 分钟, Intel 顺利时约 8 分钟。
          ATTEMPT_TIMEOUT=900
          ATTEMPTS=3

          cleanup() {
            # Kill any bundling helpers that outlived the attempt, then detach
            # only the volumes backed by images inside our own bundle/dmg
            # output — never touch unrelated runner mounts — and drop partial
            # images so the next attempt starts clean.
            # 结束存活下来的打包辅助进程, 仅卸载由本项目 bundle/dmg 产物镜像
            # 提供的卷 (绝不动 runner 上无关的挂载), 并删除半成品镜像,
            # 让下次尝试从干净状态开始。
            pkill -f bundle_dmg.sh 2>/dev/null || true
            # The CLI itself may survive the SIGTERM and keep the target dir
            # locked; stop it and any leftover bundler process too.
            # CLI 本身可能在 SIGTERM 后存活并继续占用 target 目录; 一并结束它
            # 与残留的打包器进程。
            pkill -f 'cargo-tauri|tauri\.js' 2>/dev/null || true
            if command -v hdiutil >/dev/null 2>&1; then
              local devs
              devs=$(hdiutil info 2>/dev/null | awk '
                /^image-path/ { img = $0 }
                /^\/dev\/disk/ && img ~ /bundle\/dmg/ { print $1 }
              ' | sort -u)
              for dev in $devs; do
                hdiutil detach -force "$dev" >/dev/null 2>&1 || true
              done
              rm -f src-tauri/target/release/bundle/dmg/rw.*.dmg
            fi
            rm -rf src-tauri/target/release/bundle
          }

          for ((attempt = 1; attempt <= ATTEMPTS; attempt++)); do
            pnpm exec tauri build --bundles ${{ matrix.bundles }} &
            build_pid=$!
            # Watchdog: SIGTERM the attempt once it exceeds the timeout.
            # 看门狗: 超过超时时间后向本次尝试发送 SIGTERM。
            ( sleep "$ATTEMPT_TIMEOUT"; kill -TERM "$build_pid" 2>/dev/null ) &
            watchdog_pid=$!

            status=0
            wait "$build_pid" || status=$?
            kill "$watchdog_pid" 2>/dev/null || true
            wait "$watchdog_pid" 2>/dev/null || true

            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$status" -eq 143 ] || [ "$status" -eq 137 ]; then
              echo "::warning::bundling attempt $attempt timed out after ${ATTEMPT_TIMEOUT}s and was killed"
            else
              echo "::warning::bundling attempt $attempt failed (exit $status)"
            fi
            cleanup
            sleep 15
          done
          echo "::error::bundling failed after $ATTEMPTS attempts"
          exit 1

      # Stage installers under explicit platform/arch names — Intel and
      # Apple Silicon macOS packages must never share a filename.
      # 以明确的平台/架构命名归档安装包 —— Intel 与 Apple Silicon 的
      # macOS 包绝不共用文件名。
      - name: Stage packages
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p packages
          shopt -s nullglob
          for f in src-tauri/target/release/bundle/dmg/*.dmg; do
            cp "$f" "packages/DeepTutorDesktop_${VERSION}_${{ matrix.platform }}.dmg"
          done
          for f in src-tauri/target/release/bundle/deb/*.deb; do
            cp "$f" "packages/DeepTutorDesktop_${VERSION}_${{ matrix.platform }}.deb"
          done
          for f in src-tauri/target/release/bundle/appimage/*.AppImage; do
            cp "$f" "packages/DeepTutorDesktop_${VERSION}_${{ matrix.platform }}.AppImage"
          done
          ls -lh packages/

      - name: Stage packages (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p packages
          shopt -s nullglob
          for f in src-tauri/target/release/bundle/nsis/*.exe; do
            cp "$f" "packages/DeepTutorDesktop_${VERSION}_${{ matrix.platform }}_setup.exe"
          done
          ls -lh packages/

      - uses: actions/upload-artifact@v4
        with:
          name: DeepTutorDesktop-${{ matrix.platform }}
          path: packages/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history and tags feed the changelog generator. The build ran on
      # main (see the build job), so the changelog commit lands on top of it.
      # 双语更新日志生成需要完整历史与 tag。构建基于 main (见 build job),
      # 因此 changelog 提交叠加在其之上。
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Cut the version section in both changelog files and capture the
      # bilingual release notes for the GitHub Release body.
      # 在两份 changelog 中落版本小节, 并捕获双语 release notes
      # 供发布页正文使用。
      - name: Update changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/update-changelog.ts --release "$VERSION" > release-notes.md

      # Push the published changelog back to main so the repo copy stays
      # authoritative; skipped when the tag is re-run with nothing to change.
      # `[skip ci]` keeps the bookkeeping commit from starting another build.
      # 将落版后的 changelog 推回 main, 保持仓库内副本为权威版本;
      # 重跑 tag 且无变化时自动跳过。`[skip ci]` 阻止记账提交再次触发构建。
      - name: Commit changelog update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md CHANGELOG.zh-CN.md
          if git diff --cached --quiet; then
            echo "changelog already up to date"
          else
            git commit -m "chore(release): publish changelog for ${GITHUB_REF_NAME} [skip ci]" \
              -m "zh-CN: 发布 ${GITHUB_REF_NAME} 双语更新日志"
            git push origin HEAD:main
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
